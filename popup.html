<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Twitch Player Reset</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header class="brand">
        <img src="icons/icon48.png" alt="">
        <div>
          <h1>Twitch Player Reset</h1>
        </div>
      </header>

      <section class="counter-card" aria-labelledby="counter-title">
        <div class="counter-icon" aria-hidden="true">↻</div>
        <div>
          <p class="counter-label" id="counter-title">PLAYER RESETS</p>
          <p class="counter-value" id="reset-count" aria-live="polite">—</p>
        </div>
        <span class="counter-caption" id="channel-name"></span>
      </section>

      <section class="settings-card" aria-labelledby="settings-title">
        <div class="section-heading">
          <div>
            <p class="section-label">AUTOMATION</p>
            <h2 id="settings-title">Reset delay</h2>
          </div>
          <span class="status-dot" aria-hidden="true"></span>
        </div>
        <p class="description">Reset the player if its loading spinner stays visible.</p>
        <label for="timeout">Wait time</label>
        <div class="setting-row">
          <input id="timeout" type="number" min="0.1" max="120" step="0.1" value="1">
          <span class="unit">SECONDS</span>
          <button id="save" type="button">Save</button>
        </div>
        <p id="status" role="status" aria-live="polite"></p>
      </section>

      <p class="note"><span aria-hidden="true">●</span> Automatic player recovery · No page reload</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
